<div class="user-menu">
    {% if session.get("user") %}
        <a class="user-link" href="{{ url_for('profile') }}">Xin chào {{ session["user"] }}</a>
        <form method="post" action="{{ url_for('logout') }}">
            <button type="submit">Đăng xuất</button>
        </form>
    {% else %}
        <a class="user-link" href="{{ url_for('login') }}">Đăng nhập</a>
    {% endif %}
</div>
