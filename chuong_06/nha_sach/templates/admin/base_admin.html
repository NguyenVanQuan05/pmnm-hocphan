{% extends "base.html" %}

{% block navbar %}{% endblock %}

{% block content %}
    <div class="row g-4">
        <aside class="col-md-3 col-lg-2">
            <div class="admin-sidebar rounded p-3">
                <div class="fw-bold text-white">Quản trị</div>
                <div class="small text-white-50 mb-3">Nhà sách Sông Hương</div>

                <nav class="nav nav-pills flex-column gap-1">
                    <a class="nav-link {{ is_active('admin_dashboard') }}"
                       href="{{ url_for('admin_dashboard') }}">▣ Tổng quan</a>
                    <a class="nav-link {{ is_active('admin_books') }} {{ is_active('admin_book_create') }}
                              {{ is_active('admin_book_edit') }}"
                       href="{{ url_for('admin_books') }}">📚 Sách</a>
                    <a class="nav-link" href="#">🏷 Danh mục</a>
                    <a class="nav-link d-flex justify-content-between align-items-center" href="#">
                        🧾 Đơn hàng
                        {% if pending_count %}
                            <span class="badge rounded-pill badge-cart">{{ pending_count }}</span>
                        {% endif %}
                    </a>
                </nav>

                <hr class="border-secondary">
                <a class="nav-link small" href="{{ url_for('book_list') }}">← Trang bán hàng</a>
            </div>
        </aside>

        <div class="col-md-9 col-lg-10">
            {% block admin_content %}{% endblock %}
        </div>
    </div>
{% endblock %}
